<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Image Map Assignment</title>
</head>
<body>

    <h1>Image Map Assignment</h1>

    <p>Aaron Bartlett</p>
    <p>2/9/2026</p>

    <img src="media/ch03_image-to-map.jpg" usemap="#image-map" alt="Assignment Image">

    <map name="image-map">
        <!-- Rectangle -->
        <area shape="rect" coords="50,50,200,150" href="https://www.wikipedia.org" alt="Rectangle Link">

        <!-- Circle -->
        <area shape="circle" coords="350,120,60" href="https://www.github.com" alt="Circle Link">

        <!-- Polygon -->
        <area shape="poly" coords="450,50,520,80,500,150,430,130" href="https://www.mozilla.org" alt="Polygon Link">
    </map>

</body>
</html>
